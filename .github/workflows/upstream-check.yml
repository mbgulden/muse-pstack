name: Upstream pstack check

# Weekly check for upstream pstack changes.
# This is a placeholder — the actual watch runs as a local scheduled job
# (see docs/UPDATING.md). This workflow documents the check so contributors
# understand the process.

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream for new commits
        run: |
          echo "Upstream: https://github.com/cursor/plugins/tree/main/pstack"
          echo ""
          echo "This workflow is informational. The actual porting pipeline"
          echo "runs locally per docs/UPDATING.md:"
          echo "  1. Weekly watch detects upstream changes"
          echo "  2. Human reviews and ports"
          echo "  3. Live skills updated and verified"
          echo "  4. This repo updated"
          echo "  5. Tagged release pushed"
          echo ""
          echo "Last verified upstream SHA: d4575673 (v0.15.28)"
          echo "See UPSTREAM.md for the port manifest."
